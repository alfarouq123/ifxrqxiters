<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFxrq // online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<style>
  :root{
    --bg: #0c0e12;
    --panel: #14171d;
    --panel-2: #1b1f27;
    --line: #262b34;
    --text: #e9e8e3;
    --muted: #868c96;
    --lime: #c084fc;
    --magenta: #ff3d7f;
    --danger: #ff5c5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(198,255,61,0.06), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,61,127,0.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter', sans-serif;
  margin:0;
  padding:0;
  min-height:100dvh;
  overflow:hidden;
}
  .app{
    width:100vw;
    height:100dvh;
    max-width:none;
    background:var(--panel);
    border:none;
    border-radius:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:none;
    position:relative;
  }

  /* ===== HEADER ===== */
  .head{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .avatar{
    width:46px; height:46px;
    flex-shrink:0;
    clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
    background: linear-gradient(135deg, var(--lime), #7c3aed);
    display:flex; align-items:center; justify-content:center;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    color:#0c0e12;
    font-size:18px;
    position:relative;
  }
  .dot{
    position:absolute;
    bottom:-1px; right:-1px;
    width:12px; height:12px;
    border-radius:50%;
    background:var(--lime);
    border:2px solid var(--panel);
    box-shadow:0 0 8px var(--lime);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .head-info{flex:1; min-width:0;}
  .head-name{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:17px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:8px;
  }
  .head-tag{
    font-size:10px; font-family:'JetBrains Mono', monospace; color:#0c0e12;
    background:var(--lime); padding:1px 6px; border-radius:4px; font-weight:500; letter-spacing:0.5px;
  }
  .head-sub{ font-size:12px; color:var(--muted); font-family:'JetBrains Mono', monospace; margin-top:2px; }

  /* ===== HUD STRIP ===== */
  .hud{ display:flex; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); border-bottom:1px solid var(--line); background:#0f1116; }
  .hud div{ flex:1; padding:6px 10px; border-right:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud div:last-child{border-right:none;}
  .hud b{color:var(--text); font-weight:500;}

  /* ===== CHAT ===== */
  .chat{ flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:12px; }
  .chat::-webkit-scrollbar{width:6px;}
  .chat::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .row{ display:flex; gap:8px; align-items:flex-end; max-width:92%; }
  .row.bot{ align-self:flex-start; }
  .row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .mini-av{
    width:24px; height:24px; flex-shrink:0;
    clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
    background:linear-gradient(135deg, var(--lime), #7c3aed);
    display:flex; align-items:center; justify-content:center;
    font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:10px; color:#0c0e12;
  }
  .bubble{ padding:10px 13px; font-size:14.5px; line-height:1.55; word-break:break-word; }
  .row.bot .bubble{ background:var(--panel-2); border:1px solid var(--line); border-radius:3px 14px 14px 14px; color:var(--text); }
  .row.user .bubble{
    background: linear-gradient(135deg, rgba(198,255,61,0.16), rgba(198,255,61,0.08));
    border:1px solid rgba(198,255,61,0.35); border-radius:14px 3px 14px 14px; color:var(--text); white-space:pre-wrap;
  }
  .row.sys{ align-self:center; max-width:95%; }
  .row.sys .bubble{ background:transparent; border:1px dashed var(--line); color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:11.5px; text-align:center; border-radius:8px; }
  .row.err .bubble{ border-color:rgba(255,92,92,0.4); color:var(--danger); }

  /* ===== MARKDOWN CONTENT (bot bubble) ===== */
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble ul, .bubble ol{ margin:0 0 8px 18px; }
  .bubble a{ color:#5da9ff; text-decoration:none; }
  .bubble a:hover{ text-decoration:underline; }
  .plugin-mention{ color:#c084fc; font-weight:700; background:rgba(192,132,252,.14); padding:0 4px; border-radius:5px; }
  .bubble code{
    background:#0f1116; border:1px solid var(--line); border-radius:4px;
    padding:1px 5px; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--lime);
  }
  .code-block{ margin:8px 0; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    background:#0f1116; padding:6px 10px; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  .code-head button{
    background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:5px;
    font-size:10px; padding:3px 8px; cursor:pointer; font-family:'JetBrains Mono', monospace;
  }
  .code-head button:hover{ color:var(--lime); border-color:var(--lime); }
  .code-block pre{ margin:0; padding:12px; overflow-x:auto; font-size:12.5px; }
  .code-block pre code{ background:none; border:none; padding:0; color:inherit; }

  .bubble table{ border-collapse:collapse; width:100%; margin:8px 0; font-size:13px; }
  .bubble th, .bubble td{ border:1px solid var(--line); padding:6px 9px; text-align:left; }
  .bubble th{ background:#0f1116; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--lime); }
  .bubble tr:nth-child(even) td{ background:rgba(255,255,255,0.02); }

  .bubble img{ max-width:100%; border-radius:9px; margin:6px 0; border:1px solid var(--line); display:block; }

  .typing{ display:flex; gap:4px; padding:11px 14px; background:var(--panel-2); border:1px solid var(--line); border-radius:3px 14px 14px 14px; width:fit-content; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--lime); opacity:0.5; animation:blink 1.1s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);} }

  /* ===== SEARCH PLUGIN RESULT ===== */
  .search-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--lime);
    background:rgba(198,255,61,0.1); border:1px solid rgba(198,255,61,0.3);
    padding:2px 8px; border-radius:20px; margin-bottom:8px;
  }
  .source-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .source-item{
    display:flex; align-items:center; gap:8px;
    background:#0f1116; border:1px solid var(--line); border-radius:9px; padding:7px 9px;
  }
  .source-favicon{ width:18px; height:18px; border-radius:4px; flex-shrink:0; background:var(--panel); }
  .source-meta{ flex:1; min-width:0; }
  .source-title{ font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .source-host{ font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace; }
  .source-btn{
    flex-shrink:0; background:transparent; border:1px solid var(--lime); color:var(--lime);
    font-family:'JetBrains Mono', monospace; font-size:10px; padding:5px 9px; border-radius:7px; cursor:pointer; letter-spacing:0.4px;
  }
  .source-btn:hover{ background:var(--lime); color:#0c0e12; }

  /* ===== ATTACHMENTS PREVIEW ===== */
  .attach-strip{ display:flex; gap:6px; padding:8px 10px 0; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:4px 8px 4px 4px; font-size:11px; font-family:'JetBrains Mono', monospace; color:var(--muted);
  }
  .chip img{ width:22px; height:22px; object-fit:cover; border-radius:5px; }
  .chip .filedot{ width:22px; height:22px; border-radius:5px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:12px; }
  .chip button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0 2px; }
  .chip button:hover{ color:var(--danger); }

  /* ===== INPUT ===== */
  .inputbar{ border-top:1px solid var(--line); background:var(--panel-2); padding:10px; display:flex; gap:8px; align-items:flex-end; position:relative; }
  .iconbtn{
    width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--bg);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s;
    font-size:22px; font-weight:400; line-height:1;
  }
  .iconbtn:hover{ color:var(--lime); border-color:var(--lime); }
  .iconbtn.active{ color:var(--lime); border-color:var(--lime); transform:rotate(45deg); }
  .input-wrap{ flex:1; position:relative; }
  .input-edit{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    color:var(--text); font-family:'Inter', sans-serif; font-size:14px; line-height:1.4;
    min-height:42px; max-height:110px; overflow-y:auto; overflow-wrap:break-word; white-space:pre-wrap;
    outline:none; caret-color:#c084fc; -webkit-user-modify:read-write-plaintext-only;
  }
  .input-edit:focus{ border-color:#c084fc; }
  .input-edit:empty::before{ content:attr(data-placeholder); color:#868c96; pointer-events:none; }
  .input-edit::-webkit-scrollbar{ width:6px; }
  .input-edit::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .send{
    width:42px; height:42px; border-radius:12px; border:none; background:var(--lime); color:#0c0e12;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s;
  }
  .send:hover{ background:#d8b4fe; }
  .send:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }

  /* ===== PLUS MENU (kamera/foto/file/plugin) ===== */
  .plus-menu{
    position:absolute;
    bottom:56px; left:10px;
    width:190px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    gap:2px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    z-index:20;
  }
  .plus-menu.show{ display:flex; }
  .plus-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--text);
  }
  .plus-item span{ flex:1; }
  .plus-item:hover{ background:var(--bg); color:var(--lime); }
  .plus-item.back{ color:var(--muted); font-size:11.5px; border-bottom:1px solid var(--line); margin-bottom:3px; padding-bottom:10px; }

  /* ===== @ MENTION DROPDOWN ===== */
  .mention-dropdown{
    position:absolute;
    bottom:52px; left:0;
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    display:none;
    z-index:20;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    max-height:min(300px, 42vh);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .mention-dropdown.show{ display:block; }
  .mention-dropdown::-webkit-scrollbar{ width:6px; }
  .mention-dropdown::-webkit-scrollbar-track{ background:transparent; }
  .mention-dropdown::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .mention-dropdown::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
  .mention-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .mention-item:hover, .mention-item.active{ background:var(--bg); }
  .mention-item.active{ outline:1px solid rgba(192,132,252,.45); }
  .mention-item b{ color:var(--lime); font-family:'JetBrains Mono', monospace; font-size:12.5px; }
  .mention-item span{ font-size:11px; color:var(--muted); }

  /* ghost hint <link> abu-abu di dalem input */
  .input-ghost{
    position:absolute; left:12px; top:9px;
    color:#868c96; opacity:.9;
    font-family:'Inter', sans-serif; font-size:14px; line-height:1.4;
    pointer-events:none; white-space:pre; z-index:5;
  }

  /* tombol sesi baru di hud */
  #newChatBtn{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:10px; padding:3px 9px; border-radius:7px;
    cursor:pointer; transition:.15s;
  }
  #newChatBtn:hover{ color:#ff5c5c; border-color:#ff5c5c; }

  /* ===== SOURCE VIEWER OVERLAY ===== */
  .overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; padding:0; z-index:30; }
  .overlay.show{ display:flex; }
  .viewer-panel{ width:100%; height:100%; background:var(--panel); display:flex; flex-direction:column; }
  .viewer-header{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--line); background:var(--panel-2);
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text);
  }
  .viewer-favicon{ width:16px; height:16px; border-radius:3px; }
  .viewer-header a, .viewer-header button{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-decoration:none; font-size:14px;
  }
  .viewer-header a:hover, .viewer-header button:hover{ color:var(--lime); border-color:var(--lime); }
  .viewer-iframe{ flex:1; width:100%; border:none; background:#fff; }
  .viewer-note{ font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace; padding:6px 12px; border-top:1px solid var(--line); background:var(--panel-2); }
  /* ===== GEAR + PANEL PLUGIN ===== */
  .gearbtn{
    margin-left:auto; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; width:36px; height:36px;
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease; flex-shrink:0;
  }
  .gearbtn:hover{ transform:rotate(90deg); border-color:var(--lime); box-shadow:0 0 10px rgba(192,132,252,.35); }
  .gearbtn.active{ transform:rotate(90deg); border-color:var(--lime); }

  .plug-overlay{
    position:fixed; inset:0; background:rgba(6,7,10,.72); backdrop-filter:blur(4px);
    display:none; z-index:80; align-items:flex-end; justify-content:center;
  }
  .plug-overlay.show{ display:flex; }
  .plug-panel{
    width:min(560px, 100%); height:min(78vh, 640px); background:var(--panel);
    border:1px solid var(--line); border-bottom:none; border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; overflow:hidden;
    animation:plugUp .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes plugUp{ from{ transform:translateY(60px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .plug-head{
    padding:14px 16px 10px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, var(--panel-2), var(--panel));
    display:flex; flex-direction:column; gap:10px;
  }
  .plug-title{ display:flex; align-items:center; justify-content:space-between; }
  .plug-title b{ font-size:14px; color:var(--lime); font-family:'JetBrains Mono', monospace; letter-spacing:.5px; }
  .plug-title span{ font-size:10.5px; color:var(--muted); font-family:'JetBrains Mono', monospace; }
  .plug-close{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12px; font-family:'JetBrains Mono',monospace; }
  .plug-close:hover{ color:var(--text); border-color:var(--magenta); }
  .plug-search{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:9px 12px; font-size:13px; font-family:'JetBrains Mono', monospace; outline:none;
  }
  .plug-search:focus{ border-color:var(--lime); }
  .plug-cats{ display:flex; gap:6px; overflow-x:auto; padding:10px 14px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .plug-cats::-webkit-scrollbar{ display:none; }
  .plug-cat{
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:5px 11px; font-size:11px; cursor:pointer; white-space:nowrap;
    font-family:'JetBrains Mono', monospace;
  }
  .plug-cat.on{ background:var(--lime); color:#191322; border-color:var(--lime); font-weight:600; }
  .plug-list{ flex:1; overflow-y:auto; padding:10px 14px 16px; display:flex; flex-direction:column; gap:8px; }
  .plug-list::-webkit-scrollbar{ width:6px; }
  .plug-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .plug-item{
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:10px 12px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .plug-item:hover{ border-color:var(--lime); transform:translateX(2px); }
  .plug-item-top{ display:flex; align-items:center; gap:8px; }
  .plug-item b{ color:var(--lime); font-family:'JetBrains Mono', monospace; font-size:13px; }
  .plug-item .plug-io{ margin-left:auto; font-size:9.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .plug-item p{ margin:4px 0 0; font-size:11.5px; color:var(--muted); line-height:1.45; }
  .plug-item .plug-usage{ margin-top:5px; font-size:10px; color:var(--magenta); font-family:'JetBrains Mono',monospace; opacity:.85; }
  .plug-empty{ text-align:center; color:var(--muted); font-size:12px; padding:30px 0; font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>

<div class="app">

  <div class="head">
    <div class="avatar">IF<div class="dot"></div></div>
    <div class="head-info">
      <div class="head-name">ifxrq <span class="head-tag">ONLINE</span></div>
      <div class="head-sub" id="pingLine">watskin jr. · ping 24ms</div>
    </div>
    <button class="gearbtn" id="gearBtn" title="plugin & fitur">⚙️</button>
  </div>

  <div class="hud">
    <div>sesi: <b id="hudSession">----</b></div>
    <div>pesan: <b id="hudCount">0</b></div>
    <button id="newChatBtn" title="mulai sesi baru (hapus semua riwayat)">🗑️ sesi baru</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="attach-strip" id="attachStrip"></div>

  <div class="inputbar">
    <input type="file" id="fileInput" multiple hidden>
    <div class="iconbtn" id="plusBtn" title="tambah">+</div>
    <div class="plus-menu" id="plusMenu"></div>

    <div class="input-wrap">
      <div id="input" class="input-edit" contenteditable="true" data-placeholder="ketik sesuatu ke ifxrq... (@search buat nyari di internet)"></div>
      <div class="mention-dropdown" id="mentionDropdown"></div>
    </div>

    <button class="send" id="sendBtn" title="kirim">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>

  <div class="overlay" id="viewerOverlay">
    <div class="viewer-panel">
      <div class="viewer-header">
        <img id="viewerFavicon" class="viewer-favicon">
        <span id="viewerHost">-</span>
        <div style="flex:1"></div>

/* ═══ adapter contenteditable → API ala textarea (biar kode lama tetap jalan) ═══ */
function editText(){
  let out = '';
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType === 3) out += c.nodeValue;
      else if(c.tagName === 'BR') out += '\n';
      else walk(c);
    }
  })(editEl);
  return out.replace(/\u00A0/g, ' ');
}
function getCaretOffset(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return editText().length;
  const range = sel.getRangeAt(0);
  if(!editEl.contains(range.startContainer)) return editText().length;
  const pre = range.cloneRange();
  pre.selectNodeContents(editEl);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString().replace(/\u00A0/g,' ').length;
}
function setCaretOffset(offset){
  const sel = window.getSelection();
  const range = document.createRange();
  let remaining = offset, node = null, npos = 0;
  const walker = document.createTreeWalker(editEl, NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const len = walker.currentNode.nodeValue.length;
    if(remaining <= len){ node = walker.currentNode; npos = remaining; break; }
    remaining -= len;
  }
  sel.removeAllRanges();
  if(node){ range.setStart(node, npos); range.collapse(true); }
  else { range.selectNodeContents(editEl); range.collapse(false); }
  sel.addRange(range);
}
function wrapMentions(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const node of nodes){
    const t = node.nodeValue;
    if(!/@[\w-]+/.test(t)) continue;
    if(node.parentElement && node.parentElement.closest('.plugin-mention')) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    t.replace(/@([\w-]+)/g, (m, _g, off) => {
      if(off > last) frag.appendChild(document.createTextNode(t.slice(last, off)));
      const span = document.createElement('span');
      span.className = 'plugin-mention';
      span.textContent = m;
      frag.appendChild(span);
      last = off + m.length;
      return m;
    });
    if(last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

  setCaretOffset(caret);              // caret balik ke posisi persis
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function normalizeText(value){
  if (typeof value === 'string') return value;
  if (value == null) return '';
  if (typeof value === 'object') {
    return normalizeText(
      value.text ?? value.content ?? value.message ?? value.result ?? value.answer ?? value.response
    ) || JSON.stringify(value);
  }
  return String(value);
}

function highlightMentions(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node => {
    const text = node.nodeValue;
    if (!text || !/@[\w-]+/.test(text)) return;
    if (node.parentElement && node.parentElement.closest('code, pre, a')) return;

    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    text.replace(/@([\w-]+)/g, (match, cmd, offset) => {
      if (offset > lastIndex) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex, offset)));
      }
      const span = document.createElement('span');
      span.className = 'plugin-mention';
      span.textContent = match;
      frag.appendChild(span);
      lastIndex = offset + match.length;
    });

    if (lastIndex < text.length) {
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    node.parentNode.replaceChild(frag, node);
  });
}

function renderMarkdown(raw){
  const source = normalizeText(raw).replace(/^\uFEFF/, '');
  const dirty = marked.parse(source);
  const clean = DOMPurify.sanitize(dirty, { ADD_ATTR: ['target'] });
  const wrap = document.createElement('div');
  wrap.innerHTML = clean;
  highlightMentions(wrap);

  wrap.querySelectorAll('pre code').forEach(codeEl => {
    hljs.highlightElement(codeEl);
    const lang = (codeEl.className.match(/language-(\w+)/) || [,'text'])[1];
    const pre = codeEl.parentElement;
    const block = document.createElement('div');
    block.className = 'code-block';
    const head = document.createElement('div');
    head.className = 'code-head';
    head.innerHTML = `<span>${lang}</span><button type="button">copy</button>`;
    head.querySelector('button').addEventListener('click', (e)=>{
      navigator.clipboard.writeText(codeEl.textContent);
      e.target.textContent = 'disalin ✓';
      setTimeout(()=> e.target.textContent = 'copy', 1500);
    });
    pre.replaceWith(block);
    block.appendChild(head);
    block.appendChild(pre);
  });

  return wrap;
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function renderAttachStrip(){

    if(a.mimeType.startsWith('image/')){
      chip.innerHTML = `<img src="${a.previewUrl}">`;
    } else {
      chip.innerHTML = `<div class="filedot">📄</div>`;
    }
    const label = document.createElement('span');
    label.textContent = a.name.length > 16 ? a.name.slice(0,14) + '…' : a.name;
    chip.appendChild(label);
    const rm = document.createElement('button');
    rm.textContent = '✕';
    rm.addEventListener('click', ()=>{ attachments.splice(idx,1); renderAttachStrip(); });
    chip.appendChild(rm);
    attachStrip.appendChild(chip);
  });
}

function insertMention(cmd){
  const current = inputEl.value;
  const caretPos = inputEl.selectionStart;
  const before = current.slice(0, caretPos);
  const after = current.slice(caretPos);
  const match = before.match(/@(\w*)$/);
  let newValue, newCaret;
  if(match){
    newValue = before.slice(0, match.index) + '@' + cmd + ' ' + after;
    newCaret = match.index + cmd.length + 2;
  } else {
    newValue = (before ? before + ' ' : '') + '@' + cmd + ' ' + after;
    newCaret = newValue.length - after.length;
  }
  inputEl.value = newValue;
  inputEl.focus();
  inputEl.setSelectionRange(newCaret, newCaret);
  inputEl.dispatchEvent(new Event('input'));
}

}

function setActiveMention(idx){
  const items = mentionItems();
  if(!items.length) return;
  mentionIndex = (idx + items.length) % items.length;
  items.forEach((el,i)=> el.classList.toggle('active', i === mentionIndex));
  if (items[mentionIndex].scrollIntoView) items[mentionIndex].scrollIntoView({ block:'nearest' });
}

// GHOST HINT — ketik @plugin → muncul hint abu-abu, contoh: <link>
// ============================================================
const ghostEl = document.createElement('div');
ghostEl.id = 'inputGhost';
ghostEl.className = 'input-ghost';
ghostEl.textContent = '';
document.querySelector('.input-wrap').appendChild(ghostEl);
const ghostMeasure = document.createElement('canvas').getContext('2d');


function argHintFor(cmd){
  const p = PLUGIN_MAP.get(cmd);
  if(!p) return null;
  if(p.inputType === 'none') return null;
  if(p.inputType === 'image') return '🖼️ klik + buat attach gambar';
  const m = (p.usage || '').match(/<([^>]+)>/);
  const base = m ? '<' + m[1] + '>' : '<teks>';
  return p.inputType === 'text+image' ? base + ' + 🖼️ (opsional)' : base;
}

function updateGhost(){
  ghostEl.textContent = '';
  const m = inputEl.value.match(/^@([\w-]+)(\s*)$/);
  if(!m) return;
  const hint = argHintFor(m[1].toLowerCase());
  if(!hint) return;
  try{
    const cs = getComputedStyle(inputEl);
    ghostMeasure.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    ghostEl.style.transform = 'translateX(' + Math.ceil(ghostMeasure.measureText(inputEl.value).width) + 'px)';
  }catch(_e){ ghostEl.style.transform = 'none'; }
  ghostEl.textContent = hint;
}
updateGhost();

function plugTypeIcon(p){
  const io = [];
  if(p.inputType === 'image') io.push('🖼️ in');
  else if(p.inputType === 'text+image') io.push('🖼️+📝 in');
  else if(p.inputType === 'text') io.push('📝 in');
  else io.push('⚡ no-in');
  if(p.outputType === 'image') io.push('🖼️ out');
  else if(p.outputType === 'audio') io.push('🎧 out');
  else if(p.outputType === 'file') io.push('📦 out');
  else io.push('📝 out');

function renderPlugCats(){
  if(!PLUGIN_MENU) return;

function renderPlugList(){
  if(!PLUGIN_MENU){ plugList.innerHTML = '<div class="plug-empty">belum ke-load... coba buka lagi</div>'; return; }
  let items = [];
  for(const cat of PLUGIN_MENU.categories){
    if(plugActiveCat !== 'all' && cat.key !== plugActiveCat) continue;
    for(const p of cat.plugins){
      if(plugQuery){
        const q = plugQuery.toLowerCase();
        const hay = (p.name + ' ' + (p.alias||[]).join(' ') + ' ' + p.description).toLowerCase();
        if(!hay.includes(q)) continue;
      }
      items.push({ ...p, catEmoji: cat.emoji, catLabel: cat.label });

  }
  if(!items.length){ plugList.innerHTML = '<div class="plug-empty">gak ada plugin yang cocok 🗿</div>'; return; }
  plugList.innerHTML = items.map(p =>
    `<div class="plug-item" data-cmd="${p.name}">
       <div class="plug-item-top">${p.catEmoji} <b>@${p.name}</b> <span class="plug-io">${plugTypeIcon(p)}</span></div>

       <div class="plug-usage">${escapeHtml(p.usage)}${p.example ? ' — ' + escapeHtml(p.example) : ''}</div>

function extractFirstUrl(text){
  const match = String(text || '').match(/https?:\/\/[^\s)\]\}>'"]+/i);
  return match ? match[0] : '';
}

function parseEditResponse(data){
  if (typeof data === 'string') {
    return { imageUrl: data, caption: '' };
  }

  const imageUrl =
    data.image ||
    data.url ||
    data.result ||
    data.output ||
    data.data?.image ||
    data.data?.url ||
    data.data?.result ||
    data.data?.output ||
    '';

  const caption = normalizeText(
    data.message ?? data.caption ?? data.text ?? data.result ?? data.answer ?? data.response
  );

  return { imageUrl: normalizeText(imageUrl), caption };
}

function addImageBubble(imageUrl, captionMarkdown){
  const row = document.createElement('div');
  row.className = 'row bot';

  const av = document.createElement('div');
  av.className = 'mini-av';
  av.textContent = 'IF';
  row.appendChild(av);

  const b = document.createElement('div');
  b.className = 'bubble';

  const badge = document.createElement('div');
  badge.className = 'search-badge';
  badge.innerHTML = '🖼️ hasil edit foto';
  b.appendChild(badge);

  const img = document.createElement('img');
  img.src = imageUrl;
  img.alt = 'hasil edit foto';
  img.loading = 'lazy';
  img.referrerPolicy = 'no-referrer';
  b.appendChild(img);

  if (captionMarkdown) {
    const captionWrap = renderMarkdown(captionMarkdown);
    b.appendChild(captionWrap);
  }

  row.appendChild(b);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

async function runEditPlugin(originalText, imageUrl, prompt){
  addBubble('user', originalText, false);
  history.push({ role:'user', parts:[{ text: originalText }] });

  inputEl.value = ''; updateGhost();
  sendBtn.disabled = true;
  hudCount.textContent = history.filter(h => h.role === 'user').length;
  showTyping();

  try{
    const apiUrl =
      `https://api.synoxcloud.xyz/edit/nanobanana?url=${encodeURIComponent(imageUrl)}&prompt=${encodeURIComponent(prompt)}`;

    const res = await fetch(apiUrl, {
      method: 'GET',
      headers: { 'Accept': 'application/json,text/plain,*/*' }
    });

    const rawText = await res.text();
    hideTyping();

    let data = rawText;
    try{
      data = JSON.parse(rawText);
    }catch(_err){}

    if(!res.ok){
      const errMsg =
        data?.error?.message ||
        data?.message ||
        rawText ||
        `http ${res.status}`;
      addSystemLine(`[error] plugin edit gagal — ${errMsg}`, true);
      history.pop();
      return;
    }

    const parsed = parseEditResponse(data);
    const finalImageUrl = parsed.imageUrl || extractFirstUrl(rawText);

    if(!finalImageUrl){
      addSystemLine('[error] plugin edit gagal — hasil gambar tidak ditemukan', true);
      history.pop();
      return;
    }

    addImageBubble(finalImageUrl, parsed.caption || `prompt: ${prompt}`);
    history.push({ role:'model', parts:[{ text: `[gambar hasil edit] ${prompt}` }] });

  }catch(err){
    hideTyping();
    addSystemLine(`[error] plugin edit gagal — ${err.message}`, true);
    history.pop();
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function parseSearchResponse(json){
  if(typeof json === 'string') return { answer: json, sources: [] };

  const answer = normalizeText(
    json.message ?? json.result ?? json.answer ?? json.response ??
    json.text ?? json.data?.message ?? json.data?.result
  ) || JSON.stringify(json, null, 2);

  let rawSources =
    json.sources || json.links || json.references ||
    json.results || json.data?.sources || [];

  if(!Array.isArray(rawSources)) rawSources = [];

  const sources = rawSources.map(s=>{
    if(typeof s === 'string') return { title: s, url: s };
    return {
      title: normalizeText(s.title || s.name || s.snippet || s.url || s.link || 'sumber'),
      url: normalizeText(s.url || s.link || s.href || '')
    };
  }).filter(s => s.url);

  return { answer, sources };
}

async function runGenericPlugin(originalText, cmd, argText){

    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        command: cmd,
        text: argText,
        imageBase64: img ? img.data : undefined,
        imageMime: img ? img.mimeType : undefined
      })
    });
    const data = await res.json();
    hideTyping();

    if(!res.ok){
      const msg = data?.error?.message || data?.error || `http ${res.status}`;
      addSystemLine(`[error] @${cmd} gagal — ${msg}`, true);
      history.pop();
      return;
    }
    attachments = [];
    renderAttachStrip();

    if(data.type === 'text'){
      addBubble('bot', data.text || '[kosong]', true);
      history.push({ role:'model', parts:[{ text: data.text || '' }] });

    } else if(data.type === 'image'){
      const row = document.createElement('div');
      row.className = 'row bot';
      const av = document.createElement('div'); av.className='mini-av'; av.textContent='IF'; row.appendChild(av);
      const b = document.createElement('div'); b.className='bubble';
      const badge = document.createElement('div'); badge.className='search-badge'; badge.textContent = `⚙️ @${cmd}`; b.appendChild(badge);
      const el = document.createElement('img');
      el.src = data.url || `data:${data.mime};base64,${data.base64}`;
      el.style.maxWidth = '100%'; el.style.borderRadius = '10px'; el.style.display = 'block';
      if(data.url){ el.style.cursor = 'zoom-in'; el.onclick = ()=> window.open(data.url, '_blank'); }
      b.appendChild(el);
      if(data.caption){ const c = renderMarkdown(data.caption); b.appendChild(c); }
      row.appendChild(b); chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
      history.push({ role:'model', parts:[{ text: `[gambar hasil @${cmd}]` }] });

    } else if(data.type === 'audio'){
      const row = document.createElement('div');
      row.className = 'row bot';
      const av = document.createElement('div'); av.className='mini-av'; av.textContent='IF'; row.appendChild(av);
      const b = document.createElement('div'); b.className='bubble';
      const badge = document.createElement('div'); badge.className='search-badge'; badge.textContent = `🎧 @${cmd}`; b.appendChild(badge);
      const au = document.createElement('audio');
      au.controls = true; au.src = data.url || `data:${data.mime};base64,${data.base64}`;
      au.style.width = '100%';
      b.appendChild(au);
      row.appendChild(b); chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
      history.push({ role:'model', parts:[{ text: `[audio hasil @${cmd}]` }] });

    } else if(data.type === 'file'){
      const row = document.createElement('div');
      row.className = 'row bot';
      const av = document.createElement('div'); av.className='mini-av'; av.textContent='IF'; row.appendChild(av);
      const b = document.createElement('div'); b.className='bubble';
      const badge = document.createElement('div'); badge.className='search-badge'; badge.textContent = `📦 @${cmd}`; b.appendChild(badge);
      const a = document.createElement('a');
      a.textContent = `⬇️ ${data.filename || 'unduh hasil'}`;
      a.style.color = '#c084fc'; a.style.fontWeight = '700';
      if(data.url){
        a.href = data.url; a.target = '_blank'; a.rel = 'noopener';
        const note = document.createElement('div');
        note.className = 'source-host';
        note.textContent = 'file gede — kebuka di tab baru, tinggal save';
        b.appendChild(a); b.appendChild(note);
      } else {
        a.href = `data:${data.mime};base64,${data.base64}`;
        a.download = data.filename || (`${cmd}-hasil`);
        b.appendChild(a);
      }
      row.appendChild(b); chatEl.appendChild(row); chatEl.scrollTop = chatEl.scrollHeight;
      history.push({ role:'model', parts:[{ text: `[file hasil @${cmd}]` }] });

    } else {
      addBubble('bot', '```json\n' + JSON.stringify(data, null, 2) + '\n```', true);
      history.push({ role:'model', parts:[{ text: `[hasil @${cmd}]` }] });
    }

    hideTyping();
    addSystemLine(`[error] @${cmd} gagal — ${err.message}`, true);
    history.pop();
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function sendMessage(){
  const raw = inputEl.value.trim();
  if(!raw && attachments.length === 0) return;

  const editMatch = raw.match(/^@edit\s+(https?:\/\/\S+)\s+([\s\S]+)/i);
  if(editMatch){
    await runEditPlugin(raw, editMatch[1].trim(), editMatch[2].trim());
    return;
  }

  const editAutoUrl = extractFirstUrl(raw);
  if(/^(?:edit|ubah|ganti|jadikan)\b/i.test(raw) && editAutoUrl){
    const prompt = raw
      .replace(editAutoUrl, '')
      .replace(/^(?:@edit|edit|ubah|ganti|jadikan)\b/i, '')
      .trim();
    if(prompt){
      await runEditPlugin(raw, editAutoUrl, prompt);
      return;
    }
  }
  if(/^(?:@edit|edit|ubah|ganti|jadikan)\b/i.test(raw) && !editAutoUrl){
    addSystemLine('[system] buat edit foto, kirim url gambar publik dulu. contoh: @edit https://contoh.com/foto.jpg ubah jadi malam', true);
    return;
  }

  const searchMatch = raw.match(/^@search\s+([\s\S]+)/i);
  if(searchMatch){
    await runSearchPlugin(raw, searchMatch[1].trim());
    return;
  }
  if(/^@search\s*$/i.test(raw)){
    addSystemLine('[system] abis @search ketik query-nya, contoh: @search skor portugal vs kroasia', true);
    return;
  }

  const ringkasMatch = raw.match(/^@ringkas\s+([\s\S]+)/i);
  if(ringkasMatch){
    await runRingkasPlugin(raw, ringkasMatch[1].trim());
    return;
  }
  if(/^@ringkas\s*$/i.test(raw)){
    addSystemLine('[system] abis @ringkas ketik teksnya, contoh: @ringkas paragraf yang panjang', true);
    return;
  }

  // ── @plugin generik (semua plugin dari ⚙️ / api/run) ──
  const atMatch = raw.match(/^@([\w-]+)(?:\s+([\s\S]*))?$/);
  if(atMatch && PLUGIN_MAP.size && PLUGIN_MAP.has(atMatch[1].toLowerCase())){
    await runGenericPlugin(raw, atMatch[1].toLowerCase(), (atMatch[2] || '').trim());
    return;
  }
  if(atMatch && atMatch[1].toLowerCase() !== 'edit' && atMatch[1].toLowerCase() !== 'search' && atMatch[1].toLowerCase() !== 'ringkas'){
    addSystemLine(`[system] plugin @${atMatch[1]} gak ada. pencet ⚙️ di atas buat liat daftar plugin`, true);
    return;
  }

  const parts = [];
  if(raw) parts.push({ text: raw });
  attachments.forEach(a => parts.push({ inlineData: { mimeType: a.mimeType, data: a.data } }));

  const row = addBubble('user', raw || '(kirim file)', false);
  if(attachments.length){
    const wrap = document.createElement('div');
    attachments.forEach(a=>{
      if(a.previewUrl){
        const img = document.createElement('img');
        img.src = a.previewUrl;
        img.style.maxWidth = '160px';
        img.style.borderRadius = '9px';
        img.style.marginTop = '6px';
        img.style.display = 'block';
        wrap.appendChild(img);
      }
    });
    row.querySelector('.bubble').appendChild(wrap);
  }

  history.push({ role:'user', parts });
  inputEl.value = ''; updateGhost();
  attachments = [];
  renderAttachStrip();
  sendBtn.disabled = true;
  hudCount.textContent = history.filter(h=>h.role==='user').length;
  showTyping();

  try{
    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, systemInstruction: SYSTEM_PROMPT, contents: history })
    });

    const data = await res.json();
    hideTyping();

    if(!res.ok){
      const msg = data?.error?.message || `http ${res.status}`;
      addSystemLine(`[error] gagal connect ke backend — ${msg}`, true);
      history.pop();
      return;
    }

    const reply = normalizeText(
      data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join('')
      ?? data?.text
      ?? data?.result
      ?? data?.answer
      ?? data?.message
    ) || '[kosong — kena filter atau candidate abis]';
    addBubble('bot', reply, true);
    history.push({ role:'model', parts:[{ text: reply }] });

  }catch(err){
    hideTyping();
    addSystemLine(`[error] request gagal — ${err.message}`, true);
    history.pop();
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown', (e)=>{
  // dropdown @ kebuka → navigasi keyboard: ↑ ↓ pilih, Enter pakai, Esc tutup
  if(mentionDropdown.classList.contains('show')){
    const items = mentionItems();
    if(e.key === 'ArrowDown'){ e.preventDefault(); setActiveMention(mentionIndex + 1); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); setActiveMention(mentionIndex - 1); return; }
    if(e.key === 'Enter'){
      e.preventDefault();
      const pick = mentionIndex >= 0 ? items[mentionIndex] : items[0];
      if(pick){ pick.click(); }
      return;
    }
    if(e.key === 'Escape'){ e.preventDefault(); mentionDropdown.classList.remove('show'); return; }
  }
  if(e.key === 'Enter' && e.shiftKey){
    e.preventDefault();
    document.execCommand('insertText', false, '\n');
    return;
  }
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

      if(html.length > 2200000){
        // kegedean (banyak gambar) → simpen bubble terakhir aja yang muat
        const kids = [...chatEl.children];
        let acc = '';
        for(let i = kids.length - 1; i >= 0; i--){
          const h = kids[i].outerHTML;
          if(acc.length + h.length > 2200000) break;
          acc = h + acc;
        }
        html = acc;
      }
      localStorage.setItem(CHAT_KEY, html);
      let h = history;
      let hist = JSON.stringify(h);
      while(hist.length > 900000 && h.length > 2){
        h = h.slice(-Math.max(2, Math.floor(h.length / 2)));
        hist = JSON.stringify(h);
      }
      localStorage.setItem(HIST_KEY, hist);
    }catch(_e){ /* storage penuh — biarin, chat tetep jalan */ }
  }, 300);
}
new MutationObserver(saveChat).observe(chatEl, { childList: true });

document.getElementById('newChatBtn').addEventListener('click', ()=>{
  history = [];
  attachments = [];
  renderAttachStrip();
  try{ localStorage.removeItem(CHAT_KEY); localStorage.removeItem(HIST_KEY); }catch(_e){}
  chatEl.innerHTML = '';
  hudCount.textContent = '0';
  hudSession.textContent = Math.random().toString(16).slice(2,8);
  addBubble('bot', 'sesi baru dimulai 🗿 tanya apa hari ini?', false);
});

// pesan pembuka / restore sesi lama
(function bootChat(){
  let saved = null;
  try{ saved = localStorage.getItem(CHAT_KEY); }catch(_e){}
  if(saved && saved.trim().length > 20){
    chatEl.innerHTML = saved;
    chatEl.scrollTop = chatEl.scrollHeight;
    try{
      const h = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
      if(Array.isArray(h) && h.length) history = h;
    }catch(_e){}
    hudCount.textContent = history.filter(x => x.role === 'user').length;
    addSystemLine('[system] sesi sebelumnya dipulihkan — gw masih inget obrolan kita 😼', false);
  }else{
    addBubble('bot', 'yo, gw ifxrq 🗿 pencet ⚙️ di kanan atas buat liat semua plugin & fitur (60+), atau ketik @ buat autocomplete command. mau nyari sesuatu di internet? ketik @search, atau edit foto pakai @edit url gambar promptnya', false);
  }
})();
</script>
